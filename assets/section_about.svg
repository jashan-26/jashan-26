<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none">
  <rect width="1200" height="280" fill="#1A1826"/>

  <!-- Window frame -->
  <rect x="16" y="16" width="1168" height="248" rx="16" fill="#FFF5F0" stroke="#25212B" stroke-width="2.5"/>

  <!-- Title bar -->
  <rect x="16" y="16" width="1168" height="42" rx="16" fill="#A8E6CF" stroke="#25212B" stroke-width="2.5"/>
  <rect x="16" y="38" width="1168" height="20" fill="#A8E6CF"/>
  <line x1="16" y1="58" x2="1184" y2="58" stroke="#25212B" stroke-width="2"/>

  <!-- Dots -->
  <circle cx="42" cy="38" r="7" fill="#FCD2DC" stroke="#25212B" stroke-width="1.5"/>
  <circle cx="64" cy="38" r="7" fill="#FCD2DC" stroke="#25212B" stroke-width="1.5"/>
  <circle cx="86" cy="38" r="7" fill="#FCD2DC" stroke="#25212B" stroke-width="1.5"/>

  <!-- File icon -->
  <g transform="translate(104, 26)">
    <rect x="0" y="0" width="16" height="20" rx="2" fill="#FCD2DC" stroke="#25212B" stroke-width="1.5"/>
    <line x1="4" y1="6" x2="12" y2="6" stroke="#25212B" stroke-width="1"/>
    <line x1="4" y1="10" x2="12" y2="10" stroke="#25212B" stroke-width="1"/>
    <line x1="4" y1="14" x2="9" y2="14" stroke="#25212B" stroke-width="1"/>
  </g>

  <!-- Title -->
  <text x="130" y="43" font-family="'Courier New', monospace" font-size="17" font-weight="bold" fill="#25212B">About Me</text>

  <!-- Min/Max/Close -->
  <g transform="translate(1104, 30)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#25212B" stroke-width="1.2"/>
    <line x1="4" y1="8" x2="12" y2="8" stroke="#25212B" stroke-width="1.5"/>
    <rect x="24" y="0" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#25212B" stroke-width="1.2"/>
    <rect x="28" y="4" width="8" height="8" stroke="#25212B" stroke-width="1.2" fill="none"/>
    <rect x="48" y="0" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#25212B" stroke-width="1.2"/>
    <line x1="52" y1="4" x2="60" y2="12" stroke="#25212B" stroke-width="1.2"/>
    <line x1="60" y1="4" x2="52" y2="12" stroke="#25212B" stroke-width="1.2"/>
  </g>

  <!-- Body text - bold headline -->
  <text font-family="'Courier New', monospace" font-size="19" font-weight="bold" fill="#25212B">
    <tspan x="48" y="96">An AI &amp; ML undergraduate who enjoys building practical AI solutions,</tspan>
    <tspan x="48" y="122">experimenting with new technologies, and solving real-world problems.</tspan>
  </text>

  <!-- Sub-description -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#584D60" font-weight="500">
    <tspan x="48" y="156">Passionate about AI, Machine Learning and problem solving, with a curiosity to turn ideas into impactful and scalable</tspan>
    <tspan x="48" y="176">solutions. Actively involved in the developer community (GDSC) and technical events, and always excited to learn, build</tspan>
    <tspan x="48" y="196">and collaborate on meaningful projects.</tspan>
  </text>

  <!-- Sparkles -->
  <g transform="translate(1060,80)">
    <path d="M6.0 0 L7.199999999999999 4.800000000000001 L12 6.0 L7.199999999999999 7.199999999999999 L6.0 12 L4.800000000000001 7.199999999999999 L0 6.0 L4.800000000000001 4.800000000000001 Z" fill="#FCD2DC" opacity="0.8"/>
  </g>
  <g transform="translate(1100,140)">
    <path d="M4.0 0 L4.8 3.2 L8 4.0 L4.8 4.8 L4.0 8 L3.2 4.8 L0 4.0 L3.2 3.2 Z" fill="#A8E6CF" opacity="0.8"/>
  </g>
  <g transform="translate(1080,200)">
    <path d="M5.0 0 L6.0 4.0 L10 5.0 L6.0 6.0 L5.0 10 L4.0 6.0 L0 5.0 L4.0 4.0 Z" fill="#FCD2DC" opacity="0.8"/>
  </g>

  <!-- Cute pixel cat peeking from bottom-right -->
  <g transform="translate(1060, 175)">
    <!-- Ears -->
    <path d="M6 14L12 4L17 14Z" fill="#FFFFFF" stroke="#25212B" stroke-width="1.5"/>
    <path d="M8 12L12 7L15 12Z" fill="#FCD2DC"/>
    <path d="M33 14L38 4L44 14Z" fill="#FFFFFF" stroke="#25212B" stroke-width="1.5"/>
    <path d="M35 12L38 7L42 12Z" fill="#FCD2DC"/>
    <!-- Head -->
    <ellipse cx="25" cy="24" rx="22" ry="18" fill="#FFFFFF" stroke="#25212B" stroke-width="1.5"/>
    <!-- Eyes -->
    <circle cx="16" cy="22" r="2.5" fill="#25212B"/>
    <circle cx="34" cy="22" r="2.5" fill="#25212B"/>
    <circle cx="15" cy="21" r="0.8" fill="#FFFFFF"/>
    <circle cx="33" cy="21" r="0.8" fill="#FFFFFF"/>
    <!-- Blush -->
    <ellipse cx="11" cy="27" rx="3" ry="1.5" fill="#FCD2DC"/>
    <ellipse cx="39" cy="27" rx="3" ry="1.5" fill="#FCD2DC"/>
    <!-- Mouth -->
    <path d="M23 26L25 28L27 26" stroke="#25212B" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <!-- Paws on border -->
    <ellipse cx="12" cy="40" rx="5" ry="3.5" fill="#FFFFFF" stroke="#25212B" stroke-width="1.5"/>
    <ellipse cx="38" cy="40" rx="5" ry="3.5" fill="#FFFFFF" stroke="#25212B" stroke-width="1.5"/>
  </g>
</svg>