<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" fill="none">
  <rect width="1200" height="200" fill="#1A1826"/>

  <!-- Window frame -->
  <rect x="16" y="16" width="1168" height="168" rx="16" fill="#FFF5F0" stroke="#25212B" stroke-width="2.5"/>

  <!-- Title bar -->
  <rect x="16" y="16" width="1168" height="42" rx="16" fill="#A8E6CF" stroke="#25212B" stroke-width="2.5"/>
  <rect x="16" y="38" width="1168" height="20" fill="#A8E6CF"/>
  <line x1="16" y1="58" x2="1184" y2="58" stroke="#25212B" stroke-width="2"/>

  <!-- Dots -->
  <circle cx="42" cy="38" r="7" fill="#FCD2DC" stroke="#25212B" stroke-width="1.5"/>
  <circle cx="64" cy="38" r="7" fill="#FCD2DC" stroke="#25212B" stroke-width="1.5"/>
  <circle cx="86" cy="38" r="7" fill="#FCD2DC" stroke="#25212B" stroke-width="1.5"/>

  <!-- Envelope icon -->
  <g transform="translate(104, 26)">
    <rect x="0" y="2" width="20" height="14" rx="2" fill="#FCD2DC" stroke="#25212B" stroke-width="1.5"/>
    <path d="M0 4L10 11L20 4" stroke="#25212B" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Title -->
  <text x="136" y="43" font-family="'Courier New', monospace" font-size="17" font-weight="bold" fill="#25212B">Contact</text>

  <!-- Window controls -->
  <g transform="translate(1104, 30)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#25212B" stroke-width="1.2"/>
    <line x1="4" y1="8" x2="12" y2="8" stroke="#25212B" stroke-width="1.5"/>
    <rect x="24" y="0" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#25212B" stroke-width="1.2"/>
    <rect x="28" y="4" width="8" height="8" stroke="#25212B" stroke-width="1.2" fill="none"/>
    <rect x="48" y="0" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#25212B" stroke-width="1.2"/>
    <line x1="52" y1="4" x2="60" y2="12" stroke="#25212B" stroke-width="1.2"/>
    <line x1="60" y1="4" x2="52" y2="12" stroke="#25212B" stroke-width="1.2"/>
  </g>

  <!-- Body text -->
  <text x="48" y="92" font-family="'Courier New', monospace" font-size="16" font-weight="600" fill="#25212B">Let's connect and build something impactful together.</text>

  <!-- Contact buttons row -->
  <g transform="translate(48,112)">
    <rect x="0" y="0" width="150" height="40" rx="12" fill="#A8E6CF" stroke="#25212B" stroke-width="2"/>
    <text x="75" y="26" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#25212B">Portfolio</text>
  </g>
  <g transform="translate(228,112)">
    <rect x="0" y="0" width="140" height="40" rx="12" fill="#FCD2DC" stroke="#25212B" stroke-width="2"/>
    <text x="70" y="26" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#25212B">LinkedIn</text>
  </g>
  <g transform="translate(398,112)">
    <rect x="0" y="0" width="120" height="40" rx="12" fill="#A8E6CF" stroke="#25212B" stroke-width="2"/>
    <text x="60" y="26" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#25212B">GitHub</text>
  </g>

  <!-- Sleeping cat on right -->
  <g transform="translate(980,100) scale(1.2)">
    <!-- zzz -->
    <text x="-6" y="4" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#25212B">z</text>
    <text x="2" y="-4" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#25212B">z</text>
    <text x="8" y="-10" font-family="'Courier New', monospace" font-size="8" font-weight="bold" fill="#25212B">z</text>
    <!-- Body -->
    <ellipse cx="30" cy="20" rx="24" ry="14" fill="#FFFFFF" stroke="#25212B" stroke-width="2"/>
    <!-- Head tucked -->
    <ellipse cx="12" cy="18" rx="14" ry="12" fill="#FFFFFF" stroke="#25212B" stroke-width="2"/>
    <!-- Ears -->
    <path d="M4 10L8 2L12 10Z" fill="#FFFFFF" stroke="#25212B" stroke-width="1.5"/>
    <path d="M6 9L8 4L10 9Z" fill="#FCD2DC"/>
    <path d="M12 9L16 2L19 10Z" fill="#FFFFFF" stroke="#25212B" stroke-width="1.5"/>
    <path d="M13 8L16 4L18 9Z" fill="#FCD2DC"/>
    <!-- Closed eyes -->
    <path d="M6 18C7.5 19.5 9 19.5 10 18" stroke="#25212B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M14 18C15.5 19.5 17 19.5 18 18" stroke="#25212B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Blush -->
    <ellipse cx="5" cy="22" rx="2" ry="1.2" fill="#FCD2DC"/>
    <!-- Tail -->
    <path d="M52 18C56 22 52 28 44 26" stroke="#25212B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Battery indicator -->
  <g transform="translate(900, 120)">
    <rect x="0" y="0" width="50" height="16" rx="4" fill="#FFFFFF" stroke="#25212B" stroke-width="1.5"/>
    <rect x="3" y="3" width="8" height="10" rx="1" fill="#FCD2DC"/>
    <rect x="13" y="3" width="8" height="10" rx="1" fill="#FCD2DC"/>
    <rect x="23" y="3" width="8" height="10" rx="1" fill="#FCD2DC"/>
    <rect x="33" y="3" width="8" height="10" rx="1" fill="#FCD2DC"/>
    <rect x="43" y="3" width="4" height="10" rx="1" fill="#F9EEF1"/>
    <path d="M50 5H52V11H50" fill="#25212B"/>
  </g>
</svg>