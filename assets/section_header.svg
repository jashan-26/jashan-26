<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none">
  <!-- Background -->
  <rect width="1200" height="400" fill="#1A1826"/>

  <!-- Outer mint frame -->
  <rect x="16" y="16" width="1168" height="368" rx="20" fill="none" stroke="#A8E6CF" stroke-width="3"/>

  <!-- Inner cream panel -->
  <rect x="24" y="24" width="1152" height="352" rx="16" fill="#FFF5F0" stroke="#25212B" stroke-width="2"/>

  <!-- Title bar at top of cream panel -->
  <rect x="24" y="24" width="1152" height="40" rx="16" fill="#A8E6CF" stroke="#25212B" stroke-width="2"/>
  <rect x="24" y="44" width="1152" height="20" fill="#A8E6CF"/>
  <line x1="24" y1="64" x2="1176" y2="64" stroke="#25212B" stroke-width="2"/>

  <!-- Window dots -->
  <circle cx="50" cy="44" r="7" fill="#FCD2DC" stroke="#25212B" stroke-width="1.5"/>
  <circle cx="72" cy="44" r="7" fill="#FCD2DC" stroke="#25212B" stroke-width="1.5"/>
  <circle cx="94" cy="44" r="7" fill="#FCD2DC" stroke="#25212B" stroke-width="1.5"/>

  <!-- Home icon -->
  <g transform="translate(40, 30)">
    <path d="M14 4L2 14H5V24H11V18H17V24H23V14H26L14 4Z" fill="#FCD2DC" stroke="#25212B" stroke-width="1.5"/>
  </g>

  <!-- Decorative: Pixel monitor on left -->
  <g transform="translate(80,100)">
    <!-- Monitor body -->
    <rect x="0" y="0" width="60" height="44" rx="4" fill="#25212B" stroke="#25212B" stroke-width="2"/>
    <rect x="4" y="4" width="52" height="32" rx="2" fill="#A8E6CF"/>
    <!-- Screen content lines -->
    <line x1="8" y1="12" x2="36" y2="12" stroke="#25212B" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="18" x2="48" y2="18" stroke="#25212B" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="8" y1="24" x2="30" y2="24" stroke="#25212B" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <!-- Stand -->
    <rect x="22" y="44" width="16" height="8" fill="#25212B"/>
    <rect x="14" y="52" width="32" height="4" rx="2" fill="#25212B"/>
  </g>

  <!-- Decorative: Planet -->
  <g transform="translate(160,180)">
    <circle cx="0" cy="0" r="24" fill="#FCD2DC" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="38.400000000000006" ry="7.199999999999999" fill="none" stroke="#FCD2DC" stroke-width="2" opacity="0.4" transform="rotate(-20)"/>
  </g>

  <!-- Sparkles scattered -->
  <g transform="translate(120,90)">
    <path d="M5.0 0 L6.0 4.0 L10 5.0 L6.0 6.0 L5.0 10 L4.0 6.0 L0 5.0 L4.0 4.0 Z" fill="#FCD2DC" opacity="0.8"/>
  </g>
  <g transform="translate(200,260)">
    <path d="M4.0 0 L4.8 3.2 L8 4.0 L4.8 4.8 L4.0 8 L3.2 4.8 L0 4.0 L3.2 3.2 Z" fill="#A8E6CF" opacity="0.8"/>
  </g>
  <g transform="translate(220,130)">
    <path d="M6.0 0 L7.199999999999999 4.800000000000001 L12 6.0 L7.199999999999999 7.199999999999999 L6.0 12 L4.800000000000001 7.199999999999999 L0 6.0 L4.800000000000001 4.800000000000001 Z" fill="#FCD2DC" opacity="0.8"/>
  </g>
  <g transform="translate(930,100)">
    <path d="M5.0 0 L6.0 4.0 L10 5.0 L6.0 6.0 L5.0 10 L4.0 6.0 L0 5.0 L4.0 4.0 Z" fill="#FCD2DC" opacity="0.8"/>
  </g>
  <g transform="translate(980,280)">
    <path d="M4.0 0 L4.8 3.2 L8 4.0 L4.8 4.8 L4.0 8 L3.2 4.8 L0 4.0 L3.2 3.2 Z" fill="#A8E6CF" opacity="0.8"/>
  </g>
  <g transform="translate(1050,160)">
    <path d="M7.0 0 L8.4 5.6000000000000005 L14 7.0 L8.4 8.4 L7.0 14 L5.6000000000000005 8.4 L0 7.0 L5.6000000000000005 5.6000000000000005 Z" fill="#FCD2DC" opacity="0.8"/>
  </g>
  <g transform="translate(680,90)">
    <path d="M4.0 0 L4.8 3.2 L8 4.0 L4.8 4.8 L4.0 8 L3.2 4.8 L0 4.0 L3.2 3.2 Z" fill="#A8E6CF" opacity="0.8"/>
  </g>
  <g transform="translate(740,340)">
    <path d="M5.0 0 L6.0 4.0 L10 5.0 L6.0 6.0 L5.0 10 L4.0 6.0 L0 5.0 L4.0 4.0 Z" fill="#FCD2DC" opacity="0.8"/>
  </g>

  <!-- Main title -->
  <text x="600" y="155" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="56" font-weight="bold" fill="#25212B" letter-spacing="-1">Jashanpreet Kaur</text>
  <text x="720" y="155" font-family="'Courier New', Courier, monospace" font-size="56" font-weight="bold" fill="#F6ADC0" opacity="0.6">_</text>

  <!-- Subtitle pill -->
  <rect x="240" y="174" width="720" height="34" rx="17" fill="#A8E6CF" stroke="#25212B" stroke-width="1.5"/>
  <text x="600" y="197" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#25212B">AI &amp; Machine Learning Undergrad  |  Aspiring AI Engineer  |  Public Collaboration Head @Emergians</text>

  <!-- Tagline -->
  <text x="600" y="240" text-anchor="middle" font-family="'Georgia', serif" font-size="17" font-style="italic" fill="#584D60">Building Solutions for Real-World Impact.</text>

  <!-- Stats row -->
  <g transform="translate(200, 270)">
    <!-- Stat 1 -->
    <g>
      <text x="0" y="20" font-family="'Courier New', monospace" font-size="32" font-weight="bold" fill="#25212B">04</text>
      <text x="0" y="40" font-family="'Courier New', monospace" font-size="12" fill="#584D60">Major Projects</text>
    </g>
    <!-- Divider -->
    <line x1="130" y1="0" x2="130" y2="45" stroke="#F6ADC0" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- Stat 2 -->
    <g transform="translate(170, 0)">
      <text x="0" y="20" font-family="'Courier New', monospace" font-size="32" font-weight="bold" fill="#25212B">05</text>
      <text x="0" y="40" font-family="'Courier New', monospace" font-size="12" fill="#584D60">Achievements</text>
    </g>
    <!-- Divider -->
    <line x1="310" y1="0" x2="310" y2="45" stroke="#F6ADC0" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- Stat 3 -->
    <g transform="translate(350, 0)">
      <text x="0" y="20" font-family="'Courier New', monospace" font-size="32" font-weight="bold" fill="#25212B">03</text>
      <text x="0" y="40" font-family="'Courier New', monospace" font-size="12" fill="#584D60">Hackathons</text>
    </g>
    <!-- Divider -->
    <line x1="480" y1="0" x2="480" y2="45" stroke="#F6ADC0" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- Stat 4 -->
    <g transform="translate(520, 0)">
      <text x="0" y="20" font-family="'Courier New', monospace" font-size="32" font-weight="bold" fill="#25212B">01+</text>
      <text x="0" y="40" font-family="'Courier New', monospace" font-size="12" fill="#584D60">Certifications</text>
    </g>
  </g>

  <!-- Pixel cat on right side -->
  <g transform="translate(1040,100) scale(1.1)">
    <!-- Ears -->
    <path d="M8 18L14 6L20 18Z" fill="#FFFFFF" stroke="#25212B" stroke-width="2"/>
    <path d="M10 16L14 9L18 16Z" fill="#FCD2DC"/>
    <path d="M36 18L42 6L48 18Z" fill="#FFFFFF" stroke="#25212B" stroke-width="2"/>
    <path d="M38 16L42 9L46 16Z" fill="#FCD2DC"/>
    <!-- Head -->
    <ellipse cx="28" cy="28" rx="24" ry="20" fill="#FFFFFF" stroke="#25212B" stroke-width="2"/>
    <!-- Eyes -->
    <circle cx="18" cy="26" r="3" fill="#25212B"/>
    <circle cx="38" cy="26" r="3" fill="#25212B"/>
    <circle cx="17" cy="25" r="1" fill="#FFFFFF"/>
    <circle cx="37" cy="25" r="1" fill="#FFFFFF"/>
    <!-- Blush -->
    <ellipse cx="12" cy="32" rx="4" ry="2" fill="#FCD2DC"/>
    <ellipse cx="44" cy="32" rx="4" ry="2" fill="#FCD2DC"/>
    <!-- Nose + Mouth -->
    <path d="M26 30L28 32L30 30" stroke="#25212B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M24 34C26 36 28 36 28 34C28 36 30 36 32 34" stroke="#25212B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Body -->
    <ellipse cx="28" cy="54" rx="20" ry="14" fill="#FFFFFF" stroke="#25212B" stroke-width="2"/>
    <!-- Paws -->
    <ellipse cx="14" cy="64" rx="6" ry="4" fill="#FFFFFF" stroke="#25212B" stroke-width="1.5"/>
    <ellipse cx="42" cy="64" rx="6" ry="4" fill="#FFFFFF" stroke="#25212B" stroke-width="1.5"/>
    <!-- Tail -->
    <path d="M48 52C56 48 58 56 52 60" stroke="#25212B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Window scene (starry night) top-right -->
  <g transform="translate(940, 70)">
    <rect x="0" y="0" width="100" height="80" rx="6" fill="#2D2640" stroke="#25212B" stroke-width="2"/>
    <rect x="4" y="4" width="92" height="72" rx="4" fill="#1a1040"/>
    <!-- Moon -->
    <circle cx="72" cy="24" r="12" fill="#FFF8DC" opacity="0.9"/>
    <!-- Stars -->
    <circle cx="20" cy="16" r="1.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="40" cy="10" r="1" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="55" cy="30" r="1.2" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="30" cy="40" r="1" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="80" cy="50" r="1.5" fill="#FFFFFF" opacity="0.6"/>
    <!-- Hills -->
    <path d="M4 76L20 55L40 65L60 50L80 60L96 48V76H4Z" fill="#2D3060" opacity="0.6"/>
  </g>

  <!-- Vine/plant decorations top-right -->
  <g transform="translate(1080, 60)">
    <path d="M0 0C-5 15 5 25 0 40" stroke="#5da87a" stroke-width="2" fill="none"/>
    <ellipse cx="-6" cy="12" rx="6" ry="4" fill="#7ec89a" opacity="0.7" transform="rotate(-30 -6 12)"/>
    <ellipse cx="5" cy="24" rx="5" ry="3.5" fill="#7ec89a" opacity="0.7" transform="rotate(20 5 24)"/>
    <ellipse cx="-4" cy="36" rx="5" ry="3" fill="#7ec89a" opacity="0.6" transform="rotate(-20 -4 36)"/>
  </g>
</svg>